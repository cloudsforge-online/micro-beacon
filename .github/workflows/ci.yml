name: CI

# ────────────────────────────────────────────────────────────────────────────────────────────────
# The estate-wide half of this file is a CALL, not a copy. The file it replaces was 266 lines and
# its own header said it was temporary, to be "deleted and replaced by a call to the shared
# reusable workflow" — that workflow exists, so this is that deletion.
#
# WHAT THE COPY COST WHILE IT SURVIVED. service-ci.yml runs a step no bespoke file had: it derives
# every scope this service's route gates demand and fails if one is absent from the registry in
# @cloudsforge/contracts-auth. identity refuses to mint a token naming an unknown scope, so an
# unregistered scope is a service-to-service surface no identity-issued token can ever reach — and
# the suite stays green regardless, because it mints its own principals. This repository gates on
# beacon:read, beacon:write and beacon:gate; nothing checked any of the three until now.
#
# The shared workflow also gives this repository things the bespoke file never had: a Postgres
# container whose DSN is exported under the exact name testsupport.ts reads, a build that FAILS if
# the database suite skipped rather than going green having proved nothing, and an image job that
# migrates and BOOTS the container and reads /livez. The old `docker` job stopped at `push: false`
# — it built the image and never once ran it.
#
# The `controls` job below is what the shared workflow does not cover: rule 7, this repository's
# stricter reading of rule 8, and the controls this service exists to add. Each is asserted as
# TEXT — the tests prove they work, these prove they are still there, so deleting one is a red
# build rather than a quiet regression in a refactor.
# ────────────────────────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  estate:
    uses: cloudsforge-online/micro-org/.github/workflows/service-ci.yml@main
    with:
      service: beacon
      database-env-var: BEACON_DATABASE_URL
      # 4011, read off src/env.ts's own default rather than chosen here. The shared workflow checks
      # that .env.example agrees with that default, so all three stay in step.
      port: 4011
      # Match production rather than the workflow's default of 16: the estate's compose files pin
      # postgres:17-alpine, and a suite that passes on a version nobody runs proves nothing.
      postgres-version: '17'
      # The image smoke test boots the real service, and src/env.ts validates its configuration at
      # import — so the container needs the variables it declares, not just a database, or it exits
      # before it can serve /livez. The identity URLs are never dialled, because /livez needs no
      # upstream. Never a real credential.
      #
      # `BEACON_TOKEN=@generate` asks service-ci.yml for a fresh `openssl rand -base64 48` per run,
      # thrown away afterwards. The line used to read
      # `BEACON_TOKEN=ci-only-not-a-real-token-0000000000000`, described in this comment as a value
      # that "only has to clear the 24-character length check" — which is the defect stated out loud
      # in configuration, and is exactly what @cloudsforge/secrets now refuses: `ci-only` and
      # `not-a-real` are both placeholder markers, and the guard has no CI exemption on purpose
      # (micro-org #142), because an escape hatch is reached for in the same hurry that produced the
      # defect. CI does not need a WEAK secret, it needs A secret — nothing in the smoke test
      # presents this token — so it generates a real one per run rather than committing a
      # high-entropy literal that a future reader could mistake for a key.
      #
      # BEACON_SERVICE_CREDENTIAL is deliberately NOT here and must not be given `@generate`: it is
      # a `cfsc_`-prefixed credential minted by identity, which `openssl rand` cannot produce, and
      # its absence is a supported mode that the smoke test is the main consumer of.
      smoke-env: |
        IDENTITY_JWKS_URL=http://127.0.0.1:4001/.well-known/jwks.json
        IDENTITY_ISSUER=http://127.0.0.1:4001
        BEACON_TOKEN=@generate
    secrets:
      # @cloudsforge/* resolves through link:../runtime rather than a registry, so the workflow
      # checks out micro-runtime as a sibling. It is private, so it needs a contents:read token.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: read

  controls:
    name: The controls this service exists to add
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 'Rule 7 — migrations are never run by the service process'
        # A service that migrates on boot turns a rolling deploy into N migrators racing each other
        # and a failed migration into a crash-loop rather than a job that stopped.
        run: |
          if grep -nE '\bmigrate\(' src/index.ts; then
            echo '::error::index.ts calls migrate — that is the migrator job, not the service'
            exit 1
          fi
          echo 'ok: the service process does not migrate'

      # ────────────────────────────────────────────────────────────────────────────────────────
      # Rule 8, read more strictly here than the shared workflow reads it.
      #
      # service-ci.yml bans setInterval, which this repository also has none of. What it does not
      # ban is setTimeout, and this repository REPLACES a service whose entire schedule was timers
      # — infra/beacon/src/probe.js, schedule.js and store.js are three module-scope
      # timers, and each one means two replicas do the work twice.
      #
      # Deadline timers are exempt and named explicitly. probes.ts and journeys.ts race a
      # setTimeout against the work, and that timer is the ONLY thing stopping a hung upstream from
      # holding a job lease for ever. It is a deadline, not a schedule; the difference is that
      # nothing recurs.
      #
      # ── A THIRD FILE, AND WHY THE EXEMPTION DID NOT GROW ────────────────────────────────────
      #
      # browser/backoff.ts waits out a rate limiter. identity caps /auth/register at five per
      # window and /auth/login at ten, taken at dispatch so a refusal costs what a success does, and
      # a shard of six money journeys reaches both — so a browser fixture has to honour the
      # `retry-after` the SERVICE named or report the product broken because it was throttled. It
      # fits this rule's own distinction: one call, one wait, one resolution, and nothing recurs.
      #
      # The first attempt put that setTimeout in the two files that needed it and this rule went
      # red, correctly. It was NOT fixed by naming two more paths here: a guard that grows an
      # exemption per caller stops being a guard. It was fixed by moving every wait in the
      # repository behind ONE file, which is bounded to 30s by construction, has no setInterval and
      # no self-rescheduling, is abortable, and whose own backoff.test.ts proves all three — so the
      # exemption is checked rather than asserted. Adding a fourth path here needs the same argument
      # made again, and the honest answer will usually be to call this one.
      # ────────────────────────────────────────────────────────────────────────────────────────
      - name: 'Rule 8 — no setTimeout outside the two deadline races and the one bounded backoff'
        run: |
          if grep -rnE '\bsetTimeout\(' src/ --include='*.ts' \
             | grep -v '\.test\.ts' \
             | grep -vE '^src/(probes|journeys)\.ts:' \
             | grep -vE '^src/browser/backoff\.ts:' \
             | grep -vE '^[^:]+:[0-9]+: *(//|\*)'; then
            echo '::error::a setTimeout outside the deadline races or browser/backoff.ts'
            exit 1
          fi
          echo 'ok: no setTimeout outside the deadline races and the bounded backoff'

      # The exemption above is only safe while backoff.ts stays the shape its header claims. A
      # setInterval there, or a second file importing node:timers to get around the grep, would be
      # the schedule this rule exists to keep out — so both are checked by name.
      - name: 'Rule 8a — the bounded backoff does not become a schedule'
        run: |
          if grep -nE '\bsetInterval\(|node:timers' src/browser/backoff.ts; then
            echo '::error::backoff.ts recurs, or reaches for node:timers — it must not'
            exit 1
          fi
          if ! grep -q 'MAX_WAIT_MS' src/browser/backoff.ts; then
            echo '::error::backoff.ts no longer bounds its wait'
            exit 1
          fi
          echo 'ok: the backoff is bounded and does not recur'

      # ────────────────────────────────────────────────────────────────────────────────────────
      # THE FOUR CONTROLS THIS SERVICE EXISTS TO ADD, ASSERTED AS TEXT.
      #
      # The tests prove they WORK; these prove they are still THERE.
      # ────────────────────────────────────────────────────────────────────────────────────────

      - name: 'AD-04 — the gate refuses on an unknown, and the database agrees'
        run: |
          grep -q 'gate_decisions_indeterminate_never_promotes' src/migrations.ts \
            || { echo '::error::the constraint that stops an indeterminate promotion is gone'; exit 1; }
          grep -A20 'const unknowns = reasons.filter' src/gate.ts \
            | grep -q "decision: 'refuse'" \
            || { echo '::error::decide() no longer refuses first on an unknown'; exit 1; }
          grep -q "determinacyOf(request.reasonCode) === 'unknown'" src/gate.ts \
            || { echo '::error::an override can now be recorded against an indeterminate reason'; exit 1; }

      - name: 'The incident dedupe index still exists'
        run: |
          grep -q 'incidents_open_uniq' src/migrations.ts \
            || { echo '::error::the partial unique index is gone; an outage would open one incident per probe'; exit 1; }
          grep -A2 'create unique index if not exists incidents_open_uniq' src/migrations.ts \
            | grep -q 'where closed_at is null' \
            || { echo '::error::the dedupe index predicate changed'; exit 1; }

      - name: 'The public projection is still an allowlist, and still has no spread'
        run: |
          grep -q 'PUBLIC_INCIDENT_FIELDS' src/publicstatus.ts \
            || { echo '::error::the public allowlist is gone'; exit 1; }
          # An OBJECT spread into the public projection is the exact leak the allowlist exists to
          # prevent, and TypeScript permits it: excess-property checking does not apply to
          # spreads. Array spreads are fine and are not matched — `[...map.entries()]` copies
          # nothing a caller controls.
          # Comment lines are excluded: this file DISCUSSES the leak it prevents, quoting the
          # exact spread that would cause it, and a check that cannot tell code from a sentence
          # about code is a check people learn to work around.
          if grep -nE '\{\s*\.\.\.' src/publicstatus.ts | grep -vE '^[0-9]+: *(\*|//)'; then
            echo '::error::an object spread appears in the public projection; every field must be named'
            exit 1
          fi

      - name: 'A conformance pass still cannot be recorded without having run something'
        run: |
          grep -q 'conformance_runs_pass_ran_something' src/migrations.ts \
            || { echo '::error::a green conformance row with nothing behind it is now possible'; exit 1; }

      - name: 'The metrics endpoint is still gated'
        run: |
          grep -A6 "define('GET', '/metrics'" src/server.ts | grep -q 'authorise' \
            || { echo '::error::/metrics is no longer authenticated; it publishes the shape of the estate'; exit 1; }

      # ────────────────────────────────────────────────────────────────────────────────────────
      # THE SMOKE TIER STUBS NOTHING, AND THIS IS THE CONTROL THAT KEEPS IT THAT WAY.
      #
      # The estate shipped completely unusable and green because every frontend's browser suite
      # did `page.route('**/*', … route.fulfill(…))` — a real browser answering its own requests
      # from a fixture, structurally unable to notice that the API was unreachable. src/browser is
      # this repository's answer and the property that makes it worth anything is the negative
      # one. `smoke.test.ts` asserts it from inside the suite; this asserts it from outside, so a
      # change that also edited that test cannot make it disappear quietly.
      #
      # smoke.test.ts itself is excluded, and only it: it must spell the forbidden calls out in
      # order to look for them. That exclusion is covered by its own case, which plants a real
      # interception and requires the scanner to find it.
      # ────────────────────────────────────────────────────────────────────────────────────────
      - name: 'The smoke tier intercepts nothing'
        run: |
          if grep -rnE '\.(route|fulfill|abort)\s*\(|setOfflineMode' src/browser/ --include='*.ts' \
             | grep -v '^src/browser/smoke.test.ts:' \
             | grep -vE '^[^:]+:[0-9]+: *(//|\*)'; then
            echo '::error::a request interception appeared in the browser tier — that is the defect this tier exists to end'
            exit 1
          fi
          echo 'ok: no request interception in src/browser'

      - name: 'The smoke tier still refuses to blanket-ignore TLS errors'
        run: |
          # `ignoreHTTPSErrors: true` for a whole run is a check that cannot fail: it reports green
          # through an expired certificate, a wrong-hostname certificate and an active
          # man-in-the-middle. estatecert.ts pins ONE public key instead, and refuses to pin any of
          # those three.
          grep -q 'PRIVATE_ROOT_ERRORS' src/browser/estatecert.ts \
            || { echo '::error::the pin allowlist is gone; anything can now be excused'; exit 1; }
          if grep -n 'ignoreHttpsErrors' src/browser/smoke.ts; then
            echo '::error::the smoke tier reached for a blanket TLS exemption'
            exit 1
          fi
          echo 'ok: the smoke tier pins a key rather than ignoring certificates'

      - name: 'The CLI still has no --force'
        run: |
          if grep -n "'--force'" src/cli.ts; then
            echo '::error::the CLI grew a --force; the break-glass is an attributed, expiring row'
            exit 1
          fi

      # A `*/` in the MIDDLE of a block comment terminates it early and silently uncomments
      # whatever follows.
      - name: 'No comment-terminating sequence inside a block comment'
        run: |
          if grep -rnE '^\s*\*.*\*/.+' src/ --include='*.ts'; then
            echo '::error::a */ appears mid-way through a block comment and terminates it early'
            exit 1
          fi

      # ────────────────────────────────────────────────────────────────────────────────────────
      # NO SECRET IN THE REPOSITORY.
      #
      # A sibling in this programme leaked a POSTGRES_PASSWORD and its history had to be rewritten
      # before it could be pushed. `.env.example` carries CHANGE_ME and nothing else.
      # ────────────────────────────────────────────────────────────────────────────────────────
      - name: 'No credential is committed'
        run: |
          if grep -nE '^BEACON_TOKEN=.+' .env.example | grep -v 'CHANGE_ME'; then
            echo '::error::.env.example carries a real-looking token'
            exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo '::error::a .env file is tracked'
            exit 1
          fi
          echo 'ok: no credential is committed'

  # ──────────────────────────────────────────────────────────────────────────────────────────────
  # THE IMAGE, PUBLISHED. `cfctl release` writes a manifest naming ghcr.io/cloudsforge-online/<repo>
  # at this repository's package.json version (micro-org tools/cfctl.ts, image name derived
  # at tools/registry.ts); `cfctl release --verify` runs `docker manifest inspect` on every
  # entry (cfctl.ts); and deploy/scripts/release-deploy.sh refuses to change anything
  # until all of them pull. Until this job existed CI built this image and threw it away, so that
  # gate rejected every service in the estate and the manifest path could not be used at all.
  #
  # `packages: write` IS GRANTED HERE rather than asked for inside the shared CI workflow, and that
  # is forced rather than stylistic: a called workflow's GITHUB_TOKEN can only be maintained or
  # reduced, never elevated, so a reusable workflow asking for a permission its caller withheld
  # fails the whole run at STARTUP — before a step runs, on pull requests as well as on main.
  # Measured on micro-org: run 30900277471 (caller capped at `packages: read`) ended in
  # startup_failure; run 30900280323 (same workflow, caller granted `packages: write`) succeeded.
  # That is also why `push: false` is correct and stays in the shared workflow's image job — that
  # job is a GATE and needs `load:` so it can boot the image and read its health endpoint. This is
  # the producer. Different purposes, so different jobs.
  # ──────────────────────────────────────────────────────────────────────────────────────────────
  publish:
    needs: [estate, controls]
    # A green push to main and nothing else. An image tag a release manifest pins has to name
    # something that passed, on the branch it will be deployed from.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: cloudsforge-online/micro-org/.github/workflows/publish-image.yml@main
    with:
      kind: service
    secrets:
      # The same sibling checkouts the Dockerfile's named build contexts need: the image cannot be
      # built without micro-runtime and micro-contracts beside it.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: write
