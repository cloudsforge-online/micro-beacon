# Continuous integration.
#
# ────────────────────────────────────────────────────────────────────────────────────────────────
# THIS FILE IS TEMPORARY. Once `cloudsforge/.github` exists (AD-03), everything below except the
# repository-specific rules is deleted and replaced by a call to the shared reusable workflow:
#
#   jobs:
#     ci:
#       uses: cloudsforge/.github/.github/workflows/service-ci.yml@v1
#       with:
#         service: beacon
#         database-env-var: BEACON_DATABASE_URL
#         port: 4011
#       secrets: inherit
#
# The measured target in docs/ecosystem/03 §5 is **zero repositories with a bespoke CI file**, so
# treat every line here as a liability with a deletion date rather than as something to extend.
# ────────────────────────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        # Not a secret: this database exists for the duration of one job, is reachable only from
        # it, and holds nothing. A real value here would be a real value in a public log.
        env:
          POSTGRES_USER: beacon
          POSTGRES_PASSWORD: beacon
          POSTGRES_DB: beacon_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U beacon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Temporary: the two checkouts and the sibling layout exist only because the runtime packages
      # are unpublished. On publish this collapses to one checkout with no `path:`.
      - uses: actions/checkout@v4
        with: { path: beacon }
      - uses: actions/checkout@v4
        with: { repository: cloudsforge/micro-runtime, path: runtime }

      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: beacon/pnpm-lock.yaml

      # `link:` resolves to the sibling's own node_modules, so the sibling must be installed before
      # this repository is. That is the price of `link:`, and it is worth paying: `file:` packs the
      # dependency and each of those packages declares files: ["dist"], so a packed install
      # resolves its exports to a dist/ that was never built.
      - name: Install the runtime packages
        run: pnpm --dir runtime install --frozen-lockfile

      - name: Install
        working-directory: beacon
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: beacon
        # Not a formality here. The public projection's allowlist is asserted against its interface
        # by an `Exact<>` type, so a field added to `PublicIncident` without being added to
        # `PUBLIC_INCIDENT_FIELDS` — or the reverse — fails THIS step and nothing else.
        run: pnpm typecheck

      - name: Migrate the test database
        working-directory: beacon
        # The migrator is exercised as a migrator, on an empty database, exactly as a deploy runs
        # it. A schema created by the test suite instead would never prove the one-shot job works —
        # and this service's two most important controls, `incidents_open_uniq` and
        # `gate_decisions_indeterminate_never_promotes`, only exist because that job ran.
        env:
          BEACON_DATABASE_URL: postgres://beacon:beacon@127.0.0.1:5432/beacon_test
          IDENTITY_JWKS_URL: http://127.0.0.1:4001/.well-known/jwks.json
          IDENTITY_ISSUER: http://127.0.0.1:4001
          BEACON_TOKEN: ci-only-not-a-real-token-0000000000000
        run: pnpm migrate

      - name: Test
        working-directory: beacon
        env:
          BEACON_TEST_DATABASE_URL: postgres://beacon:beacon@127.0.0.1:5432/beacon_test
        run: pnpm test

  # The estate-wide rules from docs/ecosystem/03 §2, as checks rather than as review discipline.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 'Rule 1 — one database, and it is this service''s own'
        run: |
          if grep -rnE '[A-Z_]*DATABASE_URL' src/ --include='*.ts' \
             | grep -vE 'BEACON_DATABASE_URL|BEACON_TEST_DATABASE_URL'; then
            echo '::error::a connection string other than BEACON_DATABASE_URL is referenced'
            exit 1
          fi
          if grep -rnE '(postgres|postgresql)://' src/ --include='*.ts' | grep -v '\.test\.ts'; then
            echo '::error::a literal connection string appears outside a test'
            exit 1
          fi

      - name: 'Rule 4 — livez, readyz and metrics exist'
        run: |
          for endpoint in /livez /readyz /metrics; do
            grep -q "'$endpoint'" src/server.ts \
              || { echo "::error::$endpoint is not served"; exit 1; }
          done

      - name: 'Rule 7 — migrations are never run by the service process'
        run: |
          if grep -nE '\bmigrate\(' src/index.ts; then
            echo '::error::index.ts calls migrate — that is the migrator job, not the service'
            exit 1
          fi

      # ────────────────────────────────────────────────────────────────────────────────────────
      # Rule 8 — every background timer is a leased job.
      #
      # This repository REPLACES a service whose entire schedule is `setInterval`, so the check
      # matters more here than anywhere: `infra/beacon/src/probe.js:98`, `schedule.js:77` and
      # `store.js:221` are three module-scope timers, and each one means two replicas do the work
      # twice.
      #
      # Deadline timers are exempt and named explicitly. `probes.ts` and `journeys.ts` race a
      # `setTimeout` against the work, and that timer is the ONLY thing that stops a hung upstream
      # holding a job lease for ever. It is a deadline, not a schedule; the difference is that
      # nothing recurs.
      # ────────────────────────────────────────────────────────────────────────────────────────
      - name: 'Rule 8 — every background timer is a leased job'
        run: |
          if grep -rnE '\bsetInterval\(' src/ --include='*.ts' \
             | grep -v '\.test\.ts' \
             | grep -vE '^[^:]+:[0-9]+: *(//|\*)'; then
            echo '::error::a setInterval was found; background work is a leased job (@cloudsforge/jobs)'
            exit 1
          fi
          if grep -rnE '\bsetTimeout\(' src/ --include='*.ts' \
             | grep -v '\.test\.ts' \
             | grep -vE '^src/(probes|journeys)\.ts:' \
             | grep -vE '^[^:]+:[0-9]+: *(//|\*)'; then
            echo '::error::a setTimeout outside the deadline races in probes.ts/journeys.ts'
            exit 1
          fi

      # ────────────────────────────────────────────────────────────────────────────────────────
      # THE FOUR CONTROLS THIS SERVICE EXISTS TO ADD, ASSERTED AS TEXT.
      #
      # The tests prove they WORK; these prove they are still THERE, so that deleting one is a red
      # build rather than a quiet regression in a refactor.
      # ────────────────────────────────────────────────────────────────────────────────────────

      - name: 'AD-04 — the gate refuses on an unknown, and the database agrees'
        run: |
          grep -q 'gate_decisions_indeterminate_never_promotes' src/migrations.ts \
            || { echo '::error::the constraint that stops an indeterminate promotion is gone'; exit 1; }
          grep -A20 'const unknowns = reasons.filter' src/gate.ts \
            | grep -q "decision: 'refuse'" \
            || { echo '::error::decide() no longer refuses first on an unknown'; exit 1; }
          grep -q "determinacyOf(request.reasonCode) === 'unknown'" src/gate.ts \
            || { echo '::error::an override can now be recorded against an indeterminate reason'; exit 1; }

      - name: 'The incident dedupe index still exists'
        run: |
          grep -q 'incidents_open_uniq' src/migrations.ts \
            || { echo '::error::the partial unique index is gone; an outage would open one incident per probe'; exit 1; }
          grep -A2 'create unique index if not exists incidents_open_uniq' src/migrations.ts \
            | grep -q 'where closed_at is null' \
            || { echo '::error::the dedupe index predicate changed'; exit 1; }

      - name: 'The public projection is still an allowlist, and still has no spread'
        run: |
          grep -q 'PUBLIC_INCIDENT_FIELDS' src/publicstatus.ts \
            || { echo '::error::the public allowlist is gone'; exit 1; }
          # An OBJECT spread into the public projection is the exact leak the allowlist exists to
          # prevent, and TypeScript permits it: excess-property checking does not apply to
          # spreads. Array spreads are fine and are not matched — `[...map.entries()]` copies
          # nothing a caller controls.
          # Comment lines are excluded: this file DISCUSSES the leak it prevents, quoting the
          # exact spread that would cause it, and a check that cannot tell code from a sentence
          # about code is a check people learn to work around.
          if grep -nE '\{\s*\.\.\.' src/publicstatus.ts | grep -vE '^[0-9]+: *(\*|//)'; then
            echo '::error::an object spread appears in the public projection; every field must be named'
            exit 1
          fi

      - name: 'A conformance pass still cannot be recorded without having run something'
        run: |
          grep -q 'conformance_runs_pass_ran_something' src/migrations.ts \
            || { echo '::error::a green conformance row with nothing behind it is now possible'; exit 1; }

      - name: 'The metrics endpoint is still gated'
        run: |
          grep -A6 "define('GET', '/metrics'" src/server.ts | grep -q 'authorise' \
            || { echo '::error::/metrics is no longer authenticated; it publishes the shape of the estate'; exit 1; }

      - name: 'The CLI still has no --force'
        run: |
          if grep -n "'--force'" src/cli.ts; then
            echo '::error::the CLI grew a --force; the break-glass is an attributed, expiring row'
            exit 1
          fi

      # A `*/` in the MIDDLE of a block comment terminates it early and silently uncomments
      # whatever follows.
      - name: 'No comment-terminating sequence inside a block comment'
        run: |
          if grep -rnE '^\s*\*.*\*/.+' src/ --include='*.ts'; then
            echo '::error::a */ appears mid-way through a block comment and terminates it early'
            exit 1
          fi

      # ────────────────────────────────────────────────────────────────────────────────────────
      # NO SECRET IN THE REPOSITORY.
      #
      # A sibling in this programme leaked a POSTGRES_PASSWORD and its history had to be rewritten
      # before it could be pushed. `.env.example` carries CHANGE_ME and nothing else.
      # ────────────────────────────────────────────────────────────────────────────────────────
      - name: 'No credential is committed'
        run: |
          if grep -nE '^BEACON_TOKEN=.+' .env.example | grep -v 'CHANGE_ME'; then
            echo '::error::.env.example carries a real-looking token'
            exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo '::error::a .env file is tracked'
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      # Temporary, and for the same reason as above.
      - uses: actions/checkout@v4
        with: { path: beacon }
      - uses: actions/checkout@v4
        with: { repository: cloudsforge/micro-runtime, path: runtime }

      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: beacon
          build-contexts: |
            runtimepkgs=runtime
          push: false
